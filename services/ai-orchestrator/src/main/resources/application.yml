spring:
  application:
    name: ai-orchestrator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ai_db
    username: ${DB_USER:smartcommerce}
    password: ${DB_PASSWORD:smartcommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8098
  shutdown: graceful

services:
  mcp:
    url: ${MCP_SERVER_URL:http://localhost:8097}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8084}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:dummy-replace-in-env}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: 4096
  timeout-seconds: 60

ai:
  daily-budget-usd: ${AI_DAILY_BUDGET_USD:10.00}
  pricing:
    input-per-million-tokens-usd: 3.0
    output-per-million-tokens-usd: 15.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}

logging:
  level:
    com.smartcommerce: DEBUG
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n'
