spring:
  application:
    name: ai-orchestrator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ai_db
    username: ${DB_USER:smartcommerce}
    password: ${DB_PASSWORD:smartcommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8098
  shutdown: graceful

services:
  mcp:
    url: ${MCP_SERVER_URL:http://localhost:8097}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8084}

# Provider-agnostic AI config.
# AI_PROVIDER selects the active adapter (anthropic | openai | gemini).
# AI_API_KEY is the provider's API key (sk-ant-..., sk-..., AIza...).
# AI_MODEL is optional — adapters pick a sensible default if blank
# (anthropic: claude-sonnet-4-6, openai: gpt-4o-mini, gemini: gemini-2.0-flash).
# AI_BASE_URL lets you override (LLM gateway, Azure OpenAI, self-hosted proxy).
ai:
  provider: ${AI_PROVIDER:anthropic}
  api-key: ${AI_API_KEY:dummy-replace-in-env}
  model: ${AI_MODEL:}
  base-url: ${AI_BASE_URL:}
  max-tokens: ${AI_MAX_TOKENS:4096}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  daily-budget-usd: ${AI_DAILY_BUDGET_USD:10.00}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}

logging:
  level:
    com.smartcommerce: DEBUG
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n'
