spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
        - id: seller-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/sellers/**
        - id: product-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/products/**,/api/offers/**,/api/categories/**
        - id: cart-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/cart/**
        - id: inventory-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/orders/**,/api/checkout/**
        - id: notification-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/notifications/**
        - id: payment-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/payments/**
        - id: catalog-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/catalog/**,/api/search/**
        - id: promotion-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/promotions/**,/api/coupons/**
        - id: shipment-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/shipments/**
        - id: recommendation-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/recommendations/**
        - id: mcp-server
          uri: http://localhost:8097
          predicates:
            - Path=/api/mcp/**
        - id: fraud-detection-service
          uri: http://localhost:8095
          predicates:
            - Path=/api/fraud/**
        - id: return-service
          uri: http://localhost:8096
          predicates:
            - Path=/api/returns/**
        - id: ai-orchestrator
          uri: http://localhost:8098
          predicates:
            - Path=/api/ai/**
        - id: brand-routes
          uri: http://localhost:8084
          predicates:
            - Path=/api/brands/**
        - id: review-routes
          uri: http://localhost:8084
          predicates:
            - Path=/api/reviews/**
        - id: admin-routes
          uri: http://localhost:8089
          predicates:
            - Path=/api/admin/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        # Spec: when allowCredentials=true, the wildcard pattern is rejected by browsers,
        # so origins are listed explicitly. Override via APP_ALLOWED_ORIGINS env var when
        # deploying behind a real domain.
        cors-configurations:
          '[/**]':
            allowedOrigins: ${APP_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
            allowedHeaders: "*"
            exposedHeaders: [Authorization, Location, Content-Disposition]
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 15

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}

logging:
  level:
    com.smartcommerce: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n'
