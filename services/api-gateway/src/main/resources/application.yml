spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 20
                key-resolver: '#{@ipKeyResolver}'
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**
        - id: seller-service
          uri: ${SELLER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/sellers/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/products/**,/api/offers/**,/api/categories/**
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/cart/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/orders/**,/api/checkout/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/api/notifications/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/payments/**
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/catalog/**,/api/search/**
        - id: promotion-service
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/promotions/**,/api/coupons/**,/api/campaigns/**
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/shipments/**
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/recommendations/**
        - id: fraud-detection-service
          uri: ${FRAUD_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/fraud/**
        - id: return-service
          uri: ${RETURN_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/api/returns/**
        - id: ai-orchestrator
          uri: ${AI_ORCHESTRATOR_URL:http://localhost:8098}
          predicates:
            - Path=/api/ai/**
        - id: brand-routes
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/brands/**
        - id: review-routes
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/reviews/**
        - id: admin-review-routes
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/admin/reviews/**
        - id: admin-routes
          uri: ${ORDER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/admin/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        # Spec: when allowCredentials=true, the wildcard pattern is rejected by browsers,
        # so origins are listed explicitly. Override via APP_ALLOWED_ORIGINS env var when
        # deploying behind a real domain.
        cors-configurations:
          '[/**]':
            allowedOrigins: ${APP_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
            allowedHeaders: "*"
            exposedHeaders: [Authorization, Location, Content-Disposition]
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 15

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://tempo:4318/v1/traces}

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET env var must be set (256+ bits)}

logging:
  level:
    com.smartcommerce: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n'
