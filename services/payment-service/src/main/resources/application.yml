spring:
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db
    username: ${DB_USER:smartcommerce}
    password: ${DB_PASSWORD:smartcommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.smartcommerce.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.smartcommerce.common.events.BaseEvent
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
            loggerLevel: BASIC


server:
  port: 8090
  shutdown: graceful

services:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8089}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8082}

iyzico:
  api-key: ${IYZICO_API_KEY:sandbox-api-key}
  secret-key: ${IYZICO_SECRET_KEY:sandbox-secret-key}
  base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
  callback-url: ${IYZICO_CALLBACK_URL:http://localhost:8090/api/payments/iyzico/callback}
  timeout-seconds: 30

# Where to send the user once Iyzico's 3DS challenge POSTs back to us. The
# Angular app handles the result page (polls payment status, shows success/failure).
app:
  frontend:
    callback-base-url: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://tempo:4318/v1/traces}

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET env var must be set (256+ bits)}

logging:
  level:
    com.smartcommerce: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n'

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 8s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 12s
        cancelRunningFuture: true
