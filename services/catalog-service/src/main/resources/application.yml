spring:
  application:
    name: catalog-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.smartcommerce.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.smartcommerce.common.events.BaseEvent

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
            loggerLevel: BASIC


server:
  port: 8086
  shutdown: graceful

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8084}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8085}

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://tempo:4318/v1/traces}

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET env var must be set (256+ bits)}

logging:
  level:
    com.smartcommerce: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n'

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 8s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 12s
        cancelRunningFuture: true
