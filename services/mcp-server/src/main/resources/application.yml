spring:
  application:
    name: mcp-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

server:
  port: 8097
  shutdown: graceful

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8086}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8084}
  recommendation:
    url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8087}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8089}
  cart:
    url: ${CART_SERVICE_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}

logging:
  level:
    com.smartcommerce: DEBUG
  pattern:
    console: '%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n'
