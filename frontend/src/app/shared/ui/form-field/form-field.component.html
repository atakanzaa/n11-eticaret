<div class="field" [class.has-error]="error()">
  <label class="sc-label">
    {{ label() }}
    @if (required()) { <span class="required">*</span> }
  </label>
  <ng-content />
  @if (error()) {
    <span class="error-text">{{ error() }}</span>
  } @else if (hint()) {
    <span class="hint">{{ hint() }}</span>
  }
</div>
