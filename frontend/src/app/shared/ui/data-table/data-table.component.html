@if (loading()) {
  <sc-spinner label="Yukleniyor..." />
} @else if (rows().length === 0) {
  <sc-empty-state [title]="emptyMessage()" icon="📋" />
} @else {
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          @for (col of columns(); track col.key) {
            <th [style.width]="col.width || 'auto'">{{ col.label }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row[trackByKey()]) {
          <tr (click)="rowClick.emit(row)">
            @for (col of columns(); track col.key) {
              <td>
                @if (getTemplate(col.key); as tmpl) {
                  <ng-container [ngTemplateOutlet]="tmpl.template" [ngTemplateOutletContext]="{ $implicit: row }" />
                } @else {
                  {{ getCellValue(row, col.key) }}
                }
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
}
