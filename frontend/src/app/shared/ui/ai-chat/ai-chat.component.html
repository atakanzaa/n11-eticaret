@if (auth.isAuthenticated()) {
  <div class="widget" [class.open]="open()">
    @if (open()) {
      <div class="panel">
        <header class="chat-header">
          <div class="header-left">
            <span class="ai-dot"></span>
            <span class="header-title">{{ 'ai.assistant' | t }}</span>
          </div>
          <button type="button" class="close-btn" (click)="toggle()" aria-label="Kapat">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </header>

        <div class="messages">
          @if (assistant.messages().length === 0) {
            <div class="welcome">
              <span class="welcome-icon">&#x2728;</span>
              <p class="welcome-text">{{ 'ai.welcome' | t }}</p>
            </div>
          }
          @for (m of assistant.messages(); track $index) {
            <div class="msg" [class]="m.role">
              @if (m.role === 'assistant') {
                <span class="avatar-dot"></span>
              }
              <div class="msg-content">{{ m.content }}</div>
            </div>
          }
          @if (assistant.loading()) {
            <div class="msg assistant typing">
              <span class="avatar-dot"></span>
              <div class="msg-content">
                <span class="dot-pulse"></span>
              </div>
            </div>
          }
        </div>

        <form class="composer" (submit)="onSubmit($event)">
          <input
            type="text"
            [(ngModel)]="draft"
            name="msg"
            [placeholder]="'ai.placeholder' | t"
            [disabled]="assistant.loading()"
            autocomplete="off"
          />
          <button
            type="submit"
            class="send-btn"
            [disabled]="!draft.trim() || assistant.loading()"
            aria-label="Gonder"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 9h12M11 5l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>
    } @else {
      <button type="button" class="bubble" (click)="toggle()" aria-label="AI Asistan">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.15)"/>
        </svg>
      </button>
    }
  </div>
}
