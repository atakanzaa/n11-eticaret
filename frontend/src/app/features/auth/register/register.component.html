<form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1>{{ 'auth.registerTitle' | t }}</h1>

  <div class="row">
    <sc-form-field [label]="'auth.firstName' | t" [required]="true" [error]="firstNameError()">
      <input type="text" formControlName="firstName" autocomplete="given-name" />
    </sc-form-field>

    <sc-form-field [label]="'auth.lastName' | t" [required]="true" [error]="lastNameError()">
      <input type="text" formControlName="lastName" autocomplete="family-name" />
    </sc-form-field>
  </div>

  <sc-form-field [label]="'auth.email' | t" [required]="true" [error]="emailError()">
    <input type="email" formControlName="email" autocomplete="email" />
  </sc-form-field>

  <sc-form-field [label]="('auth.phone' | t) + ' (' + ('common.optional' | t) + ')'" [error]="phoneError()">
    <input type="tel" formControlName="phone" autocomplete="tel" />
  </sc-form-field>

  <sc-form-field [label]="'auth.password' | t" [required]="true" [error]="passwordError()">
    <input type="password" formControlName="password" autocomplete="new-password" />
  </sc-form-field>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <button type="submit" class="primary" [disabled]="form.invalid || submitting()">
    @if (submitting()) {
      <span>{{ 'common.loading' | t }}</span>
    } @else {
      <span>{{ 'auth.registerSubmit' | t }}</span>
    }
  </button>

  <p class="muted">
    {{ 'auth.haveAccount' | t }}
    <a routerLink="/giris">{{ 'auth.loginSubmit' | t }}</a>
  </p>
</form>
