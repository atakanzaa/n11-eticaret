global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smartcommerce-services'
    metrics_path: /actuator/prometheus
    static_configs:
      # Use docker-network service names — Prometheus is on the shared
      # `n11-eticaret_smartcommerce` network and resolves them directly.
      # host.docker.internal previously required host-gateway and was flaky.
      - targets:
        - 'api-gateway:8080'
        - 'auth-service:8081'
        - 'user-service:8082'
        - 'seller-service:8083'
        - 'product-service:8084'
        - 'inventory-service:8085'
        - 'catalog-service:8086'
        - 'recommendation-service:8087'
        - 'cart-service:8088'
        - 'order-service:8089'
        - 'payment-service:8090'
        - 'shipment-service:8092'
        - 'promotion-service:8093'
        - 'notification-service:8094'
        - 'fraud-detection-service:8095'
        - 'return-service:8096'
        - 'ai-orchestrator:8098'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([a-z0-9-]+):(\d+)'
        target_label: service
        replacement: '${1}'
      - source_labels: [__address__]
        regex: '([a-z0-9-]+):(\d+)'
        target_label: service_port
        replacement: '${2}'
