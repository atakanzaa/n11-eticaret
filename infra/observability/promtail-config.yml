# Promtail tails Docker container logs from /var/lib/docker/containers
# and ships them to Loki. Each container's compose service-name is captured
# as the `service` label so Grafana can filter by service.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # `compose_service` from the Compose label is the friendly service name.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['service']
        regex: '^$'
        action: drop  # ignore non-compose containers
    pipeline_stages:
      # Service stdout is JSON for Spring services. Extract level + msg.
      - json:
          expressions:
            level: level
            msg: message
            timestamp: timestamp
            traceId: traceId
            correlationId: correlationId
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000Z"
